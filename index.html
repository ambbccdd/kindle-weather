<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Weather</title>
 <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden; /* 徹底消除滾動條 */
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 18px 10px 4px; /* 頂部保持舒適留白 */
    }
    /* 頂部雙欄並排區塊 */
    .top-section {
      width: 98%;
      margin: 0 auto;
      border-collapse: collapse;
      text-align: left;
    }
    .top-left {
      width: 48%;
      vertical-align: middle;
      border-right: 2px solid #000000;
      padding-right: 6px;
    }
    .top-right {
      width: 52%;
      vertical-align: middle;
      padding-left: 10px;
    }
    .time {
      font-size: 80px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 2px;
    }
    .date {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .current {
      font-size: 82px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
    }
    .cond-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .meta-line {
      font-size: 15px;
      margin-bottom: 2px;
      color: #111111;
      font-weight: 600;
    }
    .tips-box {
      display: inline-block;
      border: 1px solid #000000;
      padding: 3px 6px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      margin-top: 3px;
      line-height: 1.2;
    }
    hr {
      border: 0;
      border-top: 2px solid #000000;
      margin: 6px auto 4px;
      width: 98%;
    }
    /* 6 小時逐時天氣表格（放大至 15px） */
    .hourly-title {
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      width: 98%;
      margin: 0 auto 2px;
      letter-spacing: 0.5px;
    }
    .hourly-table {
      width: 98%;
      margin: 0 auto 4px;
      border-collapse: collapse;
      border-top: 1px solid #000000;
      border-bottom: 1px solid #000000;
    }
    .hourly-table td {
      width: 16.6%;
      text-align: center;
      padding: 2px 1px;
      border-right: 1px solid #e0e0e0;
      font-size: 15px;
      line-height: 1.15;
      vertical-align: top;
    }
    .hourly-table td:last-child {
      border-right: none;
    }
    .h-time { font-weight: bold; }
    .h-temp { font-weight: bold; font-size: 16px; }
    .h-pop { font-size: 13px; color: #111111; font-weight: 600; }

    /* 7 天預報列表（放大至 17px，清晰粗體） */
    .forecast-title {
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      width: 98%;
      margin: 2px auto 1px;
      letter-spacing: 0.5px;
    }
    .forecast-table {
      width: 98%;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 17px;
    }
    .forecast-table td {
      padding: 1.5px 2px;
      border-bottom: 1px solid #dcdcdc;
      line-height: 1.15;
    }
    .col-day { text-align: left; width: 28%; font-weight: bold; }
    .col-cond { text-align: center; width: 26%; }
    .col-pop { text-align: center; width: 20%; color: #111111; font-weight: 600; }
    .col-temp { text-align: right; width: 26%; font-weight: bold; }

    /* 每日正面話語區塊（放大至 18px） */
    .quote-box {
      width: 98%;
      margin: 6px auto 0;
      padding-top: 4px;
      border-top: 1px dashed #000000;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.3;
      color: #000000;
    }
  </style>
  <meta http-equiv="refresh" content="1800">
</head>
<body>
  <!-- 頂部左右並排區塊 -->
  <table class="top-section">
    <tr>
      <td class="top-left">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">載入中...</div>
        <div class="current" id="temp">--°C</div>
      </td>
      <td class="top-right">
        <div class="cond-title" id="cond">中和 · 連線中</div>
        <div class="meta-line" id="meta-pop">降雨機率：--%</div>
        <div class="meta-line" id="meta-aqi">空氣品質：讀取中...</div>
        <div class="tips-box" id="tips">穿衣建議：載入中...</div>
      </td>
    </tr>
  </table>

  <hr>

  <div class="hourly-title">未來 6 小時氣象</div>
  <table class="hourly-table" id="hourly-table">
    <tbody>
      <tr><td colspan="6" style="padding:4px;">逐時預報載入中...</td></tr>
    </tbody>
  </table>

  <div class="forecast-title">未來 7 天預報</div>
  <table class="forecast-table" id="forecast-table">
    <tbody>
      <tr><td colspan="4" style="text-align:center;">更新預報中...</td></tr>
    </tbody>
  </table>

  <!-- 每日正面小語（15px 大字） -->
  <div class="quote-box" id="daily-quote">✨ 讀取今日心靈小語...</div>

  <script>
    // 每日正面語庫（共 31 句，依日期自動輪播）
    var quotes = [
      "「每一個平凡的日子，都值得全力以赴。」",
      "「今天也是充滿無限可能的一天，加油！」",
      "「保持熱愛，奔赴山海，慢慢來也是一種快。」",
      "「心若向陽，無畏悲傷；步履不停，終有收穫。」",
      "「做自己的太陽，無需憑藉誰的光。」",
      "「專注於當下的一小步，路就會在腳下延伸。」",
      "「每天都是全新的畫布，盡情繪上精彩色彩。」",
      "「溫柔對待生活，生活也會對你報以微笑。」",
      "「生活不必非得完美，但可以充滿期待。」",
      "「累積小小的進步，終將迎來大大的奇蹟。」",
      "「保持好心情，好事正排隊向你走來。」",
      "「你遠比自己想像的更堅強、更有力量。」",
      "「無論外在天氣如何，內心都要晴空萬里。」",
      "「把期待降低，把生活過得熱氣騰騰。」",
      "「今天請記得好好愛自己，放慢腳步喝杯水。」",
      "「每個起心動念的努力，都在默默紮根。」",
      "「生活最好的狀態：未來可期，當下不負。」",
      "「不慌不忙，安靜生長，做最踏實的自己。」",
      "「風雨過後必定天晴，前方總有驚喜在等待。」",
      "「用善意與平靜擁抱今天的一切相遇。」",
      "「今天給自己一個微笑，世界也會為你亮起來。」",
      "「享受過程中的每一個瞬間，美好都在細節裡。」",
      "「跨出舒適圈的一小步，就是成長的開始。」",
      "「相信自己正在正確的節奏上前進。」",
      "「不盲目與他人比較，專注於今天的自我超越。」",
      "「把煩惱留給昨天，今天又是充滿希望的開始。」",
      "「心懷感恩，所見皆是溫暖與風景。」",
      "「做你熱愛的事，時間會給出最好的答案。」",
      "「休息是為了走更長遠的路，今天也要張弛有度。」",
      "「願你今天收穫滿滿的陽光與安心。」",
      "「堅定步伐，未來的所有美好都在向你奔來。」"
    ];

    function updateDailyQuote(twDate) {
      var seed = twDate.getFullYear() * 10000 + (twDate.getMonth() + 1) * 100 + twDate.getDate();
      var index = seed % quotes.length;
      document.getElementById('daily-quote').innerHTML = '✨ ' + quotes[index];
    }

    // 1. 本地時鐘（自動每分鐘推進）
    var lastMinute = -1;

    function setClock() {
      var now = new Date();
      var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      var d = new Date(utc + (3600000 * 8)); // 強制 UTC+8 台灣時間

      var m = d.getMinutes();

      if (m !== lastMinute) {
        lastMinute = m;

        var days = ['日', '一', '二', '三', '四', '五', '六'];
        var h = d.getHours();
        var hStr = (h < 10 ? '0' : '') + h;
        var mStr = (m < 10 ? '0' : '') + m;

        document.getElementById('clock').innerHTML = hStr + ':' + mStr;
        document.getElementById('date').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日 (週' + days[d.getDay()] + ')';
        updateDailyQuote(d);
      }
    }

    setClock();
    setInterval(setClock, 10000);

    // 2. 天氣代碼轉換
    function getDesc(code) {
      if (code === 0) return '晴朗';
      if (code <= 3) return '多雲';
      if (code >= 51 && code <= 67) return '降雨';
      if (code >= 80 && code <= 82) return '短暫雨';
      if (code >= 95) return '雷雨';
      return '陰天';
    }

    // 3. 空氣品質標籤
    function getAqiInfo(aqi) {
      if (aqi <= 50) return '良好 (' + aqi + ')';
      if (aqi <= 100) return '普通 (' + aqi + ')';
      if (aqi <= 150) return '敏感不健康 (' + aqi + ')';
      if (aqi <= 200) return '不健康 (' + aqi + ')';
      return '危害 (' + aqi + ')';
    }

    // 4. 生活與穿衣建議
    function getClothingTip(temp, pop, aqi) {
      var tip = '';
      if (temp >= 28) {
        tip = '短袖涼爽';
      } else if (temp >= 24) {
        tip = '短袖/薄長袖';
      } else if (temp >= 20) {
        tip = '薄外套/長袖';
      } else if (temp >= 16) {
        tip = '夾克/針織衫';
      } else if (temp >= 12) {
        tip = '厚外套/毛衣保暖';
      } else {
        tip = '羽絨衣/嚴防低溫';
      }

      if (pop >= 30) {
        tip += ' · 備傘 ☂';
      }
      if (aqi > 100) {
        tip += ' · 口罩 😷';
      }

      return tip;
    }

    var lat = 24.998;
    var lon = 121.503;

    // 5. 抓取空氣品質
    var aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon + '&current=us_aqi&timezone=auto';
    var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code' +
      '&hourly=temperature_2m,weather_code,precipitation_probability' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=auto';

    var currentAqi = 0;
    var aqiText = '讀取中...';

    var xhrAqi = new XMLHttpRequest();
    xhrAqi.open('GET', aqiUrl, true);
    xhrAqi.timeout = 8000;
    xhrAqi.onload = function() {
      if (xhrAqi.status >= 200 && xhrAqi.status < 300) {
        try {
          var aqiData = JSON.parse(xhrAqi.responseText);
          currentAqi = Math.round(aqiData.current.us_aqi);
          aqiText = getAqiInfo(currentAqi);
        } catch (e) {
          aqiText = '資料異常';
        }
      }
      loadWeather();
    };
    xhrAqi.onerror = function() { loadWeather(); };
    xhrAqi.ontimeout = function() { loadWeather(); };
    xhrAqi.send();

    // 6. 抓取天氣數據
    function loadWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', weatherUrl, true);
      xhr.timeout = 10000;

      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            var cur = data.current;
            var hourly = data.hourly;
            var daily = data.daily;

            var curTemp = Math.round(cur.temperature_2m);
            var curCode = cur.weather_code;
            var todayPop = (daily.precipitation_probability_max && daily.precipitation_probability_max[0] !== undefined)
                           ? daily.precipitation_probability_max[0] : 0;

            document.getElementById('temp').innerHTML = curTemp + '°C';
            document.getElementById('cond').innerHTML = '中和 · ' + getDesc(curCode);
            document.getElementById('meta-pop').innerHTML = '降雨機率：' + todayPop + '%';
            document.getElementById('meta-aqi').innerHTML = '空氣品質：' + aqiText;
            document.getElementById('tips').innerHTML = '建議：' + getClothingTip(curTemp, todayPop, currentAqi);

            // A. 未來 6 小時逐時預報
            var now = new Date();
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            var twNow = new Date(utc + (3600000 * 8));
            var currentHour = twNow.getHours();

            var startIndex = 0;
            for (var k = 0; k < hourly.time.length; k++) {
              var hourPart = parseInt(hourly.time[k].substring(11, 13), 10);
              var dayPart = parseInt(hourly.time[k].substring(8, 10), 10);
              if (dayPart === twNow.getDate() && hourPart === currentHour) {
                startIndex = k;
                break;
              }
            }

            var hourlyCells = '';
            for (var h = 0; h < 6; h++) {
              var targetIdx = startIndex + h;
              if (targetIdx < hourly.time.length) {
                var timeStr = hourly.time[targetIdx].substring(11, 16);
                var hCode = hourly.weather_code[targetIdx];
                var hTemp = Math.round(hourly.temperature_2m[targetIdx]);
                var hPop = (hourly.precipitation_probability && hourly.precipitation_probability[targetIdx] !== undefined)
                           ? hourly.precipitation_probability[targetIdx] : 0;

                hourlyCells += '<td>' +
                  '<div class="h-time">' + timeStr + '</div>' +
                  '<div>' + getDesc(hCode) + '</div>' +
                  '<div class="h-temp">' + hTemp + '°</div>' +
                  '<div class="h-pop">☂' + hPop + '%</div>' +
                '</td>';
              }
            }
            document.getElementById('hourly-table').innerHTML = '<tbody><tr>' + hourlyCells + '</tr></tbody>';

            // B. 未來 7 天預報列表
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            var rows = '';

            for (var i = 0; i < daily.time.length; i++) {
              var parts = daily.time[i].split('-');
              var dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
              var dayText = (i === 0) ? '今天' : ('週' + dayNames[dateObj.getDay()]);
              var dateText = (dateObj.getMonth() + 1) + '/' + dateObj.getDate();
              var maxT = Math.round(daily.temperature_2m_max[i]);
              var minT = Math.round(daily.temperature_2m_min[i]);
              var pop = daily.precipitation_probability_max[i] !== undefined ? daily.precipitation_probability_max[i] : 0;

              rows += '<tr>' +
                        '<td class="col-day">' + dayText + ' <span style="font-size:11px;color:#555;">' + dateText + '</span></td>' +
                        '<td class="col-cond">' + getDesc(daily.weather_code[i]) + '</td>' +
                        '<td class="col-pop">☂ ' + pop + '%</td>' +
                        '<td class="col-temp">' + minT + '°~' + maxT + '°</td>' +
                      '</tr>';
            }
            document.getElementById('forecast-table').innerHTML = '<tbody>' + rows + '</tbody>';
          } catch (e) {
            document.getElementById('cond').innerHTML = '資料解析失敗';
          }
        } else {
          document.getElementById('cond').innerHTML = '伺服器異常 (' + xhr.status + ')';
        }
      };

      xhr.onerror = function() {
        document.getElementById('cond').innerHTML = '網路連線失敗';
      };

      xhr.ontimeout = function() {
        document.getElementById('cond').innerHTML = '連線逾時，請重整';
      };

      xhr.send();
    }
  </script>
</body>
</html>
