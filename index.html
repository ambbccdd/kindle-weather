<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Weather</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #fff;
      color: #000;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 24px 16px;
    }
    .time {
      font-size: 58px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 6px;
    }
    .date {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .current {
      font-size: 50px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 20px;
      margin-bottom: 18px;
    }
    hr {
      border: 0;
      border-top: 2px solid #000;
      margin: 18px auto;
      width: 95%;
    }
    table {
      width: 95%;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 16px;
    }
    td {
      padding: 7px 2px;
      border-bottom: 1px solid #ccc;
    }
    .col-day { text-align: left; width: 30%; font-weight: bold; }
    .col-cond { text-align: center; width: 35%; }
    .col-temp { text-align: right; width: 35%; }
  </style>
  <meta http-equiv="refresh" content="1800">
</head>
<body>
  <div class="time" id="clock">--:--</div>
  <div class="date" id="date">載入中...</div>

  <div class="current" id="temp">--°C</div>
  <div class="desc" id="cond">中和天氣讀取中...</div>

  <hr>

  <table id="forecast-table">
    <tbody>
      <tr><td colspan="3" style="text-align:center;">更新預報中...</td></tr>
    </tbody>
  </table>

  <script>
    // 1. 時鐘更新
    function setClock() {
      var d = new Date();
      var days = ['日', '一', '二', '三', '四', '五', '六'];
      var h = (d.getHours() < 10 ? '0' : '') + d.getHours();
      var m = (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
      document.getElementById('clock').innerText = h + ':' + m;
      document.getElementById('date').innerText = (d.getMonth() + 1) + '月' + d.getDate() + '日 (週' + days[d.getDay()] + ')';
    }
    setClock();
