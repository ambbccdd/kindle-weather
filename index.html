<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Weather</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden; /* 徹底消除滾動條 */
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 18px 10px 4px; /* 頂部留白 */
    }
    /* 頂部雙欄並排區塊 */
    .top-section {
      width: 98%;
      margin: 0 auto;
      border-collapse: collapse;
      text-align: left;
    }
    .top-left {
      width: 48%;
      vertical-align: middle;
      border-right: 2px solid #000000;
      padding-right: 6px;
    }
    .top-right {
      width: 52%;
      vertical-align: middle;
      padding-left: 10px;
    }
    .time {
      font-size: 80px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 2px;
    }
    .date {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .current {
      font-size: 82px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
    }
    .cond-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .meta-line {
      font-size: 15px;
      margin-bottom: 2px;
      color: #111111;
      font-weight: 600;
    }
    .tips-box {
      display: inline-block;
      border: 1px solid #000000;
      padding: 3px 6px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      margin-top: 3px;
      line-height: 1.2;
    }
    hr {
      border: 0;
      border-top: 2px solid #000000;
      margin: 6px auto 4px;
      width: 98%;
    }
    /* 6 小時逐時天氣表格 */
    .hourly-title {
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      width: 98%;
      margin: 0 auto 2px;
      letter-spacing: 0.5px;
    }
    .hourly-table {
      width: 98%;
      margin: 0 auto 4px;
      border-collapse: collapse;
      border-top: 1px solid #000000;
      border-bottom: 1px solid #000000;
    }
    .hourly-table td {
      width: 16.6%;
      text-align: center;
      padding: 2px 1px;
      border-right: 1px solid #e0e0e0;
      font-size: 15px;
      line-height: 1.15;
      vertical-align: top;
    }
    .hourly-table td:last-child {
      border-right: none;
    }
    .h-time { font-weight: bold; }
    .h-temp { font-weight: bold; font-size: 16px; }
    .h-pop { font-size: 13px; color: #111111; font-weight: 600; }

    /* 7 天預報列表 */
    .forecast-title {
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      width: 98%;
      margin: 2px auto 1px;
      letter-spacing: 0.5px;
    }
    .forecast-table {
      width: 98%;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 17px;
    }
    .forecast-table td {
      padding: 1.5px 2px;
      border-bottom: 1px solid #dcdcdc;
      line-height: 1.15;
    }
    .col-day { 
      text-align: left; 
      width: 30%; 
      font-weight: bold; 
      padding-left: 10px !important; 
    }
    .col-cond { text-align: center; width: 25%; }
    .col-pop { text-align: center; width: 20%; color: #111111; font-weight: 600; }
    .col-temp { 
      text-align: right; 
      width: 25%; 
      font-weight: bold; 
      padding-right: 10px !important; 
    }

    /* 每日正面話語區塊 */
    .quote-box {
      width: 98%;
      margin: 6px auto 0;
      padding-top: 4px;
      border-top: 1px dashed #000000;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.3;
      color: #000000;
    }
  </style>
  <meta http-equiv="refresh" content="1800">
</head>
<body>
  <table class="top-section">
    <tr>
      <td class="top-left">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="date">載入中...</div>
        <div class="current" id="temp">--°C</div>
      </td>
      <td class="top-right">
        <div class="cond-title" id="cond">中和 · 連線中</div>
        <div class="meta-line" id="meta-pop">降雨機率：--%</div>
        <div class="meta-line" id="meta-aqi">空氣品質：讀取中...</div>
        <div class="tips-box" id="tips">穿衣建議：載入中...</div>
      </td>
    </tr>
  </table>

  <hr>

  <div class="hourly-title">未來 6 小時氣象</div>
  <table class="hourly-table" id="hourly-table">
    <tbody>
      <tr><td colspan="6" style="padding:4px;">逐時預報載入中...</td></tr>
    </tbody>
  </table>

  <div class="forecast-title">未來 7 天預報</div>
  <table class="forecast-table" id="forecast-table">
    <tbody>
      <tr><td colspan="4" style="text-align:center;">更新預報中...</td></tr>
    </tbody>
  </table>

    function updateDailyQuote(twDate) {
      var y = twDate.getFullYear();
      var m = twDate.getMonth() + 1;
      var d = twDate.getDate();

      var start = new Date(2026, 0, 1);
      var current = new Date(y, m - 1, d);
      var diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24));

      var index = Math.abs(diffDays * 37) % quotes.length;
      document.getElementById('daily-quote').innerHTML = quotes[index];
    }

    // 取得強制 UTC+8 的 Date 物件
    function getTwNow() {
      var now = new Date();
      var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 8));
    }

    var lastMinute = -1;

    function setClock() {
      var d = getTwNow();
      var m = d.getMinutes();

      if (m !== lastMinute) {
        lastMinute = m;

        var days = ['日', '一', '二', '三', '四', '五', '六'];
        var h = d.getHours();
        var hStr = (h < 10 ? '0' : '') + h;
        var mStr = (m < 10 ? '0' : '') + m;

        document.getElementById('clock').innerHTML = hStr + ':' + mStr;
        document.getElementById('date').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日 (週' + days[d.getDay()] + ')';
        updateDailyQuote(d);
      }
    }

    setClock();
    setInterval(setClock, 10000);

    function getDesc(code) {
      if (code === 0) return '晴朗';
      if (code <= 3) return '多雲';
      if (code >= 51 && code <= 67) return '降雨';
      if (code >= 80 && code <= 82) return '短暫雨';
      if (code >= 95) return '雷雨';
      return '陰天';
    }

    function getAqiInfo(aqi) {
      if (aqi <= 50) return '良好 (' + aqi + ')';
      if (aqi <= 100) return '普通 (' + aqi + ')';
      if (aqi <= 150) return '敏感不健康 (' + aqi + ')';
      if (aqi <= 200) return '不健康 (' + aqi + ')';
      return '危害 (' + aqi + ')';
    }

    function getClothingTip(temp, pop, aqi) {
      var tip = '';
      if (temp >= 28) {
        tip = '短袖涼爽';
      } else if (temp >= 24) {
        tip = '短袖/薄長袖';
      } else if (temp >= 20) {
        tip = '薄外套/長袖';
      } else if (temp >= 16) {
        tip = '夾克/針織衫';
      } else if (temp >= 12) {
        tip = '厚外套/毛衣保暖';
      } else {
        tip = '羽絨衣/嚴防低溫';
      }

      if (pop >= 30) {
        tip += ' · 備傘 ☂';
      }
      if (aqi > 100) {
        tip += ' · 建議戴口罩';
      }

      return tip;
    }

    var lat = 24.998;
    var lon = 121.503;

    // 強制指定 Asia/Taipei 時區（避免跨時區偏差）
    var aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon + '&current=us_aqi&timezone=Asia%2FTaipei';
    var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code' +
      '&hourly=temperature_2m,weather_code,precipitation_probability' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTaipei';

    var currentAqi = 0;
    var aqiText = '讀取中...';

    var xhrAqi = new XMLHttpRequest();
    xhrAqi.open('GET', aqiUrl, true);
    xhrAqi.timeout = 8000;
    xhrAqi.onload = function() {
      if (xhrAqi.status >= 200 && xhrAqi.status < 300) {
        try {
          var aqiData = JSON.parse(xhrAqi.responseText);
          currentAqi = Math.round(aqiData.current.us_aqi);
          aqiText = getAqiInfo(currentAqi);
        } catch (e) {
          aqiText = '資料異常';
        }
      }
      loadWeather();
    };
    xhrAqi.onerror = function() { loadWeather(); };
    xhrAqi.ontimeout = function() { loadWeather(); };
    xhrAqi.send();

    function loadWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', weatherUrl, true);
      xhr.timeout = 10000;

      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            var cur = data.current;
            var hourly = data.hourly;
            var daily = data.daily;

            var curTemp = Math.round(cur.temperature_2m);
            var curCode = cur.weather_code;

            // 1. 計算當前台灣標準時間格式：YYYY-MM-DDTHH:00
            var twNow = getTwNow();
            var y = twNow.getFullYear();
            var m = twNow.getMonth() + 1;
            var d = twNow.getDate();
            var h = twNow.getHours();

            var pad = function(num) { return (num < 10 ? '0' : '') + num; };
            var currentTargetPrefix = y + '-' + pad(m) + '-' + pad(d) + 'T' + pad(h);
            var todayDateStr = y + '-' + pad(m) + '-' + pad(d);

            // 2. 精確找出目前小時在 hourly 陣列中的位置
            var startIndex = -1;
            for (var k = 0; k < hourly.time.length; k++) {
              if (hourly.time[k].indexOf(currentTargetPrefix) === 0) {
                startIndex = k;
                break;
              }
            }
            if (startIndex === -1) {
              startIndex = 0;
            }

            // 3. 取得當前的即時降雨機率（以當前整點預估為主）
            var currentPop = (hourly.precipitation_probability && hourly.precipitation_probability[startIndex] !== undefined)
                             ? hourly.precipitation_probability[startIndex] : 0;

            document.getElementById('temp').innerHTML = curTemp + '°C';
            document.getElementById('cond').innerHTML = '中和 · ' + getDesc(curCode);
            document.getElementById('meta-pop').innerHTML = '降雨機率：' + currentPop + '%';
            document.getElementById('meta-aqi').innerHTML = '空氣品質：' + aqiText;
            document.getElementById('tips').innerHTML = '建議：' + getClothingTip(curTemp, currentPop, currentAqi);

            // A. 未來 6 小時逐時預報
            var hourlyCells = '';
            for (var i = 0; i < 6; i++) {
              var targetIdx = startIndex + i;
              if (targetIdx < hourly.time.length) {
                var timeStr = hourly.time[targetIdx].substring(11, 16);
                var hCode = hourly.weather_code[targetIdx];
                var hTemp = Math.round(hourly.temperature_2m[targetIdx]);
                var hPop = (hourly.precipitation_probability && hourly.precipitation_probability[targetIdx] !== undefined)
                           ? hourly.precipitation_probability[targetIdx] : 0;

                hourlyCells += '<td>' +
                  '<div class="h-time">' + timeStr + '</div>' +
                  '<div>' + getDesc(hCode) + '</div>' +
                  '<div class="h-temp">' + hTemp + '°</div>' +
                  '<div class="h-pop">☂ ' + hPop + '%</div>' +
                '</td>';
              }
            }
            document.getElementById('hourly-table').innerHTML = '<tbody><tr>' + hourlyCells + '</tr></tbody>';

            // B. 未來 7 天預報列表（以今天日期為準對齊）
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            var rows = '';

            // 找到今天在 daily 中的起點
            var dailyStart = 0;
            for (var dIdx = 0; dIdx < daily.time.length; dIdx++) {
              if (daily.time[dIdx] === todayDateStr) {
                dailyStart = dIdx;
                break;
              }
            }

            for (var j = 0; j < 7; j++) {
              var actualDayIdx = dailyStart + j;
              if (actualDayIdx < daily.time.length) {
                var parts = daily.time[actualDayIdx].split('-');
                var dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                var dayText = (j === 0) ? '今天' : ('週' + dayNames[dateObj.getDay()]);
                var dateText = (dateObj.getMonth() + 1) + '/' + dateObj.getDate();
                var maxT = Math.round(daily.temperature_2m_max[actualDayIdx]);
                var minT = Math.round(daily.temperature_2m_min[actualDayIdx]);
                var pop = (daily.precipitation_probability_max && daily.precipitation_probability_max[actualDayIdx] !== undefined)
                          ? daily.precipitation_probability_max[actualDayIdx] : 0;

                rows += '<tr>' +
                          '<td class="col-day">' + dayText + ' <span style="font-size:15px;color:#333;font-weight:bold;">' + dateText + '</span></td>' +
                          '<td class="col-cond">' + getDesc(daily.weather_code[actualDayIdx]) + '</td>' +
                          '<td class="col-pop">☂ ' + pop + '%</td>' +
                          '<td class="col-temp">' + minT + '°~' + maxT + '°</td>' +
                        '</tr>';
              }
            }
            document.getElementById('forecast-table').innerHTML = '<tbody>' + rows + '</tbody>';
          } catch (e) {
            document.getElementById('cond').innerHTML = '資料解析失敗';
          }
        } else {
          document.getElementById('cond').innerHTML = '伺服器異常 (' + xhr.status + ')';
        }
      };

      xhr.onerror = function() {
        document.getElementById('cond').innerHTML = '網路連線失敗';
      };

      xhr.ontimeout = function() {
        document.getElementById('cond').innerHTML = '連線逾時，請重整';
      };

      xhr.send();
    }
  </script>
</body>
</html>
