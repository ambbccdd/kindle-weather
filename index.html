<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Weather</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden; /* 徹底消除滾動條 */
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 12px 10px 4px;
    }

    /* 頂部三欄表格：左邊資訊、中間置中時鐘、右邊穿衣建議 */
    .hero-table {
      width: 98%;
      margin: 0 auto;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .hero-side-left {
      width: 25%;
      vertical-align: middle;
      text-align: left;
      padding-right: 6px;
      border-right: 1px dashed #000000;
    }
    .hero-center {
      width: 50%;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }
    .hero-side-right {
      width: 25%;
      vertical-align: middle;
      text-align: center;
      padding-left: 6px;
      border-left: 1px dashed #000000;
    }

    /* 左側資訊 */
    .side-location {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .side-meta {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
      line-height: 1.3;
      color: #111111;
    }

    /* 中間超大時間與溫度 */
    .hero-time {
      font-size: 92px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
      margin: 0 auto 3px;
    }
    .hero-date {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    /* 加大 °C 與後方文字的水平距離 */
    .hero-temp-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 20px; /* 從 8px 加大至 20px，保持充裕間距 */
    }
    .hero-temp {
      font-size: 84px;
      font-weight: bold;
      line-height: 0.95;
      letter-spacing: -2px;
    }
    .hero-cond {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    /* 右側穿搭建議加大方框 */
    .tips-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #222222;
    }
    .tips-box {
      display: inline-block;
      width: 92%;
      border: 1px solid #000000;
      padding: 7px 4px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      line-height: 1.35;
      text-align: center;
    }

    hr {
      border: 0;
      border-top: 2px solid #000000;
      margin: 8px auto 6px;
      width: 98%;
    }

    /* 未來一週折線圖容器 */
    .chart-header {
      width: 98%;
      margin: 0 auto 3px;
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      display: flex;
      justify-content: space-between;
    }
    .chart-legend {
      font-size: 13px;
      font-weight: normal;
    }
    .chart-container {
      width: 98%;
      margin: 0 auto;
      border: 1px solid #000000;
      border-radius: 4px;
      padding: 4px 0 2px;
      background: #ffffff;
    }
    svg text {
      font-family: sans-serif;
      user-select: none;
    }

    /* 每日正面小語（留白置中、無邊框） */
    .quote-box {
      width: 98%;
      margin: 10px auto 0;
      padding-top: 2px;
      border-top: none;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.5px;
      line-height: 1.35;
      color: #000000;
    }
  </style>
  <meta http-equiv="refresh" content="1800">
</head>

        <div class="side-meta" id="meta-aqi">空品：讀取中...</div>

      <td class="hero-center">
        <div class="hero-time" id="clock">--:--</div>
        <div class="hero-date" id="date">載入中...</div>
        <div class="hero-temp-row">
          <span class="hero-temp" id="temp">--°C</span>
          <span class="hero-cond" id="cond">連線中</span>
        </div>
      </td>

      <!-- 右欄：穿衣建議獨立寬敞大字 -->

    function updateDailyQuote(twDate) {
      var y = twDate.getFullYear();
      var m = twDate.getMonth() + 1;
      var d = twDate.getDate();

      var start = new Date(2026, 0, 1);
      var current = new Date(y, m - 1, d);
      var diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24));

      var index = Math.abs(diffDays * 37) % quotes.length;
      document.getElementById('daily-quote').innerHTML = quotes[index];
    }

    function getTwNow() {
      var now = new Date();
      var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 8));
    }

    var lastMinute = -1;

    function setClock() {
      var d = getTwNow();
      var m = d.getMinutes();

      if (m !== lastMinute) {
        lastMinute = m;

        var days = ['日', '一', '二', '三', '四', '五', '六'];
        var h = d.getHours();
        var hStr = (h < 10 ? '0' : '') + h;
        var mStr = (m < 10 ? '0' : '') + m;

        document.getElementById('clock').innerHTML = hStr + ':' + mStr;
        document.getElementById('date').innerHTML = (d.getMonth() + 1) + '月' + d.getDate() + '日 (週' + days[d.getDay()] + ')';
        updateDailyQuote(d);
      }
    }

    setClock();
    setInterval(setClock, 10000);

    function getDesc(code) {
      if (code === 0) return '晴朗';
      if (code <= 3) return '多雲';
      if (code >= 51 && code <= 67) return '降雨';
      if (code >= 80 && code <= 82) return '短暫雨';
      if (code >= 95) return '雷雨';
      return '陰天';
    }

    function getAqiInfo(aqi) {
      if (aqi <= 50) return '良好 (' + aqi + ')';
      if (aqi <= 100) return '普通 (' + aqi + ')';
      if (aqi <= 150) return '敏感不健康 (' + aqi + ')';
      if (aqi <= 200) return '不健康 (' + aqi + ')';
      return '危害 (' + aqi + ')';
    }

    function formatPop(val) {
      if (val === undefined || val === null || val < 5) return 0;
      return Math.round(val / 10) * 10;
    }

    function getClothingTip(temp, pop, aqi) {
      var tip = '';
      if (temp >= 28) {
        tip = '短袖涼爽';
      } else if (temp >= 24) {
        tip = '短袖/薄長袖';
      } else if (temp >= 20) {
        tip = '薄外套/長袖';
      } else if (temp >= 16) {
        tip = '夾克/針織衫';
      } else if (temp >= 12) {
        tip = '厚外套/毛衣';
      } else {
        tip = '羽絨保暖';
      }

      if (pop >= 30) {
        tip += '<br>出門備傘 ☂';
      }
      if (aqi > 100) {
        tip += '<br>建議戴口罩';
      }

      return tip;
    }

    var lat = 24.998;
    var lon = 121.503;

    var aqiUrl = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon + '&current=us_aqi&timezone=Asia%2FTaipei';
    var weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code' +
      '&hourly=temperature_2m,precipitation_probability' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTaipei';

    var currentAqi = 0;
    var aqiText = '讀取中...';

    var xhrAqi = new XMLHttpRequest();
    xhrAqi.open('GET', aqiUrl, true);
    xhrAqi.timeout = 8000;
    xhrAqi.onload = function() {
      if (xhrAqi.status >= 200 && xhrAqi.status < 300) {
        try {
          var aqiData = JSON.parse(xhrAqi.responseText);
          currentAqi = Math.round(aqiData.current.us_aqi);
          aqiText = getAqiInfo(currentAqi);
        } catch (e) {
          aqiText = '資料異常';
        }
      }
      loadWeather();
    };
    xhrAqi.onerror = function() { loadWeather(); };
    xhrAqi.ontimeout = function() { loadWeather(); };
    xhrAqi.send();

    // 純 SVG 動態折線圖（上下留出充足安全緩衝區，杜絕碰字）
    function renderWeatherChart(daysData) {
      var w = 560;
      var h = 240;
      var n = daysData.length;
      var colW = w / n;

      var allTemps = [];
      for (var i = 0; i < n; i++) {
        allTemps.push(daysData[i].max);
        allTemps.push(daysData[i].min);
      }
      var maxT = Math.max.apply(null, allTemps);
      var minT = Math.min.apply(null, allTemps);
      if (maxT === minT) { maxT += 2; minT -= 2; }

      var chartTop = 68;
      var chartBottom = 140;
      var range = chartBottom - chartTop;

      function getY(t) {
        return Math.round(chartTop + (maxT - t) * (range / (maxT - minT)));
      }

      var maxPoints = [];
      var minPoints = [];
      var labelsSvg = '';

      for (var j = 0; j < n; j++) {
        var x = Math.round((j + 0.5) * colW);
        var item = daysData[j];
        var yMax = getY(item.max);
        var yMin = getY(item.min);

        maxPoints.push(x + ',' + yMax);
        minPoints.push(x + ',' + yMin);

        // 頂部星期與加大日期
        labelsSvg += '<text x="' + x + '" y="18" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">' + item.day + '</text>';
        labelsSvg += '<text x="' + x + '" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">' + item.date + '</text>';

        // 高溫標註點與度數
        labelsSvg += '<circle cx="' + x + '" cy="' + yMax + '" r="4" fill="#000" />';
        labelsSvg += '<text x="' + x + '" y="' + (yMax - 7) + '" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">' + item.max + '°</text>';

        // 低溫標註點與度數
        labelsSvg += '<circle cx="' + x + '" cy="' + yMin + '" r="3.5" fill="#fff" stroke="#000" stroke-width="2" />';
        labelsSvg += '<text x="' + x + '" y="' + (yMin + 15) + '" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">' + item.min + '°</text>';

        // 底部天氣現象與大字降雨機率
        labelsSvg += '<text x="' + x + '" y="186" text-anchor="middle" font-size="14" fill="#000">' + item.cond + '</text>';
        labelsSvg += '<text x="' + x + '" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">☂ ' + item.pop + '%</text>';
      }

      var svgHtml = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block;">' +
        labelsSvg +
        '<polyline fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + maxPoints.join(' ') + '" />' +
        '<polyline fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round" stroke-linejoin="round" points="' + minPoints.join(' ') + '" />' +
      '</svg>';

      document.getElementById('chart-wrap').innerHTML = svgHtml;
    }

    function loadWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', weatherUrl, true);
      xhr.timeout = 10000;

      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            var cur = data.current;
            var hourly = data.hourly;
            var daily = data.daily;

            var curTemp = Math.round(cur.temperature_2m);
            var curCode = cur.weather_code;

            var twNow = getTwNow();
            var y = twNow.getFullYear();
            var m = twNow.getMonth() + 1;
            var d = twNow.getDate();
            var h = twNow.getHours();

            var pad = function(num) { return (num < 10 ? '0' : '') + num; };
            var currentTargetPrefix = y + '-' + pad(m) + '-' + pad(d) + 'T' + pad(h);
            var todayDateStr = y + '-' + pad(m) + '-' + pad(d);

            var startIndex = -1;
            for (var k = 0; k < hourly.time.length; k++) {
              if (hourly.time[k].indexOf(currentTargetPrefix) === 0) {
                startIndex = k;
                break;
              }
            }
            if (startIndex === -1) { startIndex = 0; }

            var rawCurrentPop = (hourly.precipitation_probability && hourly.precipitation_probability[startIndex] !== undefined)
                                ? hourly.precipitation_probability[startIndex] : 0;
            var currentPop = formatPop(rawCurrentPop);

            // 1. 左欄：地點與環境數值
            document.getElementById('loc-title').innerHTML = '中和區';
            document.getElementById('meta-pop').innerHTML = '降雨：' + currentPop + '%';
            document.getElementById('meta-aqi').innerHTML = '空品：' + aqiText;

            // 2. 中欄：時間與溫度置中
            document.getElementById('temp').innerHTML = curTemp + '°C';
            document.getElementById('cond').innerHTML = getDesc(curCode);

            // 3. 右欄：穿衣建議
            document.getElementById('tips').innerHTML = getClothingTip(curTemp, currentPop, currentAqi);

            // 4. 繪製未來 7 天折線圖
            var dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            var chartList = [];

            var dailyStart = 0;
            for (var dIdx = 0; dIdx < daily.time.length; dIdx++) {
              if (daily.time[dIdx] === todayDateStr) {
                dailyStart = dIdx;
                break;
              }
            }

            for (var j = 0; j < 7; j++) {
              var actualDayIdx = dailyStart + j;
              if (actualDayIdx < daily.time.length) {
                var parts = daily.time[actualDayIdx].split('-');
                var dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
                var dayText = (j === 0) ? '今天' : ('週' + dayNames[dateObj.getDay()]);
                var dateText = (dateObj.getMonth() + 1) + '/' + dateObj.getDate();
                var maxT = Math.round(daily.temperature_2m_max[actualDayIdx]);
                var minT = Math.round(daily.temperature_2m_min[actualDayIdx]);
                var rawDayPop = (daily.precipitation_probability_max && daily.precipitation_probability_max[actualDayIdx] !== undefined)
                                ? daily.precipitation_probability_max[actualDayIdx] : 0;

                chartList.push({
                  day: dayText,
                  date: dateText,
                  cond: getDesc(daily.weather_code[actualDayIdx]),
                  max: maxT,
                  min: minT,
                  pop: formatPop(rawDayPop)
                });
              }
            }
            renderWeatherChart(chartList);

          } catch (e) {
            document.getElementById('cond').innerHTML = '解析失敗';
          }
        } else {
          document.getElementById('cond').innerHTML = '異常 ' + xhr.status;
        }
      };

      xhr.onerror = function() {
        document.getElementById('cond').innerHTML = '連線失敗';
      };

      xhr.ontimeout = function() {
        document.getElementById('cond').innerHTML = '逾時';
      };

      xhr.send();
    }
  </script>
</body>
</html>
